<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Canteen System</title>

<style>

:root{
    --primary:#1e3a5f;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* MAIN CONTAINER */
.kiosk-container{
    width:95%;
    max-width:550px;
    background:var(--card);
    border-radius:24px;
    box-shadow:0 15px 40px rgba(0,0,0,0.1);
    padding:35px;
    text-align:center;
}

/* HEADER */
.site-header{
    background:var(--primary);
    color:white;
    padding:18px;
    border-radius:18px;
    margin-bottom:25px;
}

.site-header h1{
    font-size:30px;
    letter-spacing:1px;
}

.site-header h2{
    margin-top:8px;
    font-size:22px;
    color:#cbd5e1;
}

/* ICON */
.icon{
    font-size:70px;
    margin-bottom:15px;
}

/* CLOCK */
.clock{
    margin-top:15px;
    font-size:18px;
    color:#64748b;
}

/* CATEGORY */
select{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:2px solid #dbeafe;
    font-size:18px;
    margin-bottom:20px;
    outline:none;
}

/* INPUT */
input{
    width:100%;
    padding:22px;
    border-radius:18px;
    border:3px solid #cbd5e1;
    font-size:30px;
    text-align:center;
    font-weight:bold;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:var(--primary);
}

/* STATUS CARD */
.status-card{
    margin-top:25px;
    padding:25px;
    border-radius:20px;
    display:none;
    animation:fade 0.3s ease;
}

.status-card.success{
    background:#dcfce7;
    border-left:8px solid var(--success);
}

.status-card.error{
    background:#fee2e2;
    border-left:8px solid var(--danger);
}

.status-card.warning{
    background:#fef3c7;
    border-left:8px solid var(--warning);
}

.status-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.status-name{
    font-size:24px;
    font-weight:bold;
    color:var(--text);
    margin-bottom:10px;
}

.status-detail{
    font-size:18px;
    color:#475569;
}

/* LOADER */
.loader{
    margin:25px auto;
    border:5px solid #e2e8f0;
    border-top:5px solid var(--primary);
    border-radius:50%;
    width:45px;
    height:45px;
    animation:spin 1s linear infinite;
    display:none;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FOOTER */
.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:14px;
}

</style>
</head>

<body>

<div class="kiosk-container">

    <!-- HEADER -->
    <div class="site-header">
        <div class="icon">🍱</div>
        <h1>ABSENSI KANTIN</h1>
        <h2>SITE A</h2>
    </div>

    <!-- CLOCK -->
    <div class="clock" id="clock"></div>

    <!-- CATEGORY -->
    <select id="kategori">
        <option>Makan Pagi</option>
        <option selected>Makan Siang</option>
        <option>Makan Malam</option>
    </select>

    <!-- BARCODE INPUT -->
    <input 
        type="text" 
        id="barcodeInput"
        placeholder="SCAN BARCODE"
        autofocus
        autocomplete="off"
    >

    <!-- LOADER -->
    <div class="loader" id="loader"></div>

    <!-- RESULT -->
    <div class="status-card success" id="successCard">
        <div class="status-title">✅ BERHASIL</div>
        <div class="status-name">BUDI SANTOSO</div>
        <div class="status-detail">Dept Produksi</div>
    </div>

    <div class="status-card error" id="errorCard">
        <div class="status-title">❌ DITOLAK</div>
        <div class="status-detail">
            NRP bukan milik SITE A
        </div>
    </div>

    <div class="status-card warning" id="warningCard">
        <div class="status-title">⚠ SUDAH ABSEN</div>
        <div class="status-detail">
            Karyawan sudah melakukan absensi makan
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Smart Industrial Canteen System v1.0
    </div>

</div>

<script>

/* =========================================
   CONFIG
========================================= */

const SITE = "SITE A";
const PANJANG_BARCODE = 8;

/* =========================================
   ELEMENT
========================================= */

const barcodeInput = document.getElementById("barcodeInput");
const loader = document.getElementById("loader");

const successCard = document.getElementById("successCard");
const errorCard = document.getElementById("errorCard");
const warningCard = document.getElementById("warningCard");

/* =========================================
   CLOCK
========================================= */

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleDateString("id-ID") +
        " | " +
        now.toLocaleTimeString("id-ID");

}

setInterval(updateClock,1000);
updateClock();

/* =========================================
   INPUT LISTENER
========================================= */

barcodeInput.addEventListener("input", ()=>{

    const value = barcodeInput.value.trim();

    if(value.length === PANJANG_BARCODE){

        submitBarcode(value);

    }

});

/* =========================================
   SUBMIT SIMULATION
========================================= */

let isSubmitting = false;

function submitBarcode(barcode){

    if(isSubmitting) return;

    isSubmitting = true;

    hideAllCards();

    loader.style.display = "block";

    barcodeInput.disabled = true;

    /* SIMULASI API */
    setTimeout(()=>{

        loader.style.display = "none";

        /* SIMULASI VALIDASI */

        if(barcode === "80110059"){

            showSuccess();

        }else if(barcode === "99999999"){

            showWarning();

        }else{

            showError();

        }

        setTimeout(resetForm,2500);

    },1200);

}

/* =========================================
   CARD CONTROL
========================================= */

function hideAllCards(){

    successCard.style.display = "none";
    errorCard.style.display = "none";
    warningCard.style.display = "none";

}

function showSuccess(){

    successCard.style.display = "block";

}

function showError(){

    errorCard.style.display = "block";

}

function showWarning(){

    warningCard.style.display = "block";

}

/* =========================================
   RESET
========================================= */

function resetForm(){

    barcodeInput.disabled = false;
    barcodeInput.value = "";
    barcodeInput.focus();

    hideAllCards();

    isSubmitting = false;

}

</script>

</body>
</html>
